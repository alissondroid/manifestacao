# Testes a cada push na main (pull requests e outras branches rodam em ci.yml).
# O deploy numa VPS é opcional: só roda se o secret VPS_HOST existir (veja "Hospedagem" na documentação).
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Menor permissão possível para o token do GitHub: só ler o código.
permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm run build # antes dos testes: os de segurança conferem os cabeçalhos das páginas do site
      - run: npm test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HOST: ${{ secrets.VPS_HOST }}
    steps:
      - name: Atualiza a VPS
        if: ${{ env.HOST != '' }}
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          USER_: ${{ secrets.VPS_USER }}
          PORT: ${{ secrets.VPS_PORT }}
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy && chmod 600 ~/.ssh/id_deploy
          if [ -n "$KNOWN_HOSTS" ]; then
            # chave do servidor fixada no secret: um intermediário não consegue se passar pela VPS
            printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
            STRICT=yes
          else
            echo "::warning::Sem o secret VPS_KNOWN_HOSTS a chave do servidor é aceita na primeira conexão de cada execução (veja o README)."
            STRICT=accept-new
          fi
          ssh -i ~/.ssh/id_deploy -p "${PORT:-22}" -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking="$STRICT" \
            "${USER_:-root}@$HOST" 'cd /opt/avenida && BRANCH=main bash deploy/update.sh'
      - name: Deploy desligado
        if: ${{ env.HOST == '' }}
        run: echo 'Sem o secret VPS_HOST, o deploy foi ignorado (só os testes rodaram).'
